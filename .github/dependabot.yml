version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR per week for all minor/patch bumps instead of one PR per library
      gradle-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The library compiles against JavaFX 17 (the oldest line it supports) so that it
      # keeps working with hosts on any newer JavaFX release
      - dependency-name: org.openjfx:*
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
